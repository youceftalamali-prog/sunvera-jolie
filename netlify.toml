[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# Background Master AI must stay a standalone function and must not pull the
# Next.js server runtime or the heavy HTML sanitizer (jsdom / isomorphic-dompurify).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["isomorphic-dompurify", "jsdom", "canvas"]

[functions."master-ai-background"]
  # Long-running Master AI plan/execute cycles (Netlify background = up to 15 min)
  schedule = ""
