name: P0 Verification

on:
  push:
    branches:
      - arena/01a0d689-sunvera-jolie
      - arena/01a0da97-sunvera-jolie
      - release/sunvera-jolie-unified
  pull_request:
    branches:
      - master
      - release/sunvera-jolie-unified
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sunvera_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sunvera_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sunvera_ci
      AUTH_SECRET: ci-only-auth-secret-for-p0
      ADMIN_PASSWORD: ci-only-admin-password-for-p0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set CI authentication values
        run: |
          AUTH_SECRET="$(node -e 'const { randomBytes } = require("crypto"); process.stdout.write(randomBytes(32).toString("hex"));')"
          ADMIN_PASSWORD="CiOnly$(node -e 'const { randomBytes } = require("crypto"); process.stdout.write(randomBytes(12).toString("hex"));')"
          {
            echo "AUTH_SECRET=$AUTH_SECRET"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Check PostgreSQL connectivity
        run: npm run db:check

      - name: Apply database schema
        run: npm run db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start application
        run: |
          npm run start > /tmp/sunvera-next.log 2>&1 &
          echo $! > /tmp/sunvera-next.pid

      - name: Smoke test database-backed catalog
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/catalog > /tmp/catalog.json; then
              test -s /tmp/catalog.json
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready."
          cat /tmp/sunvera-next.log || true
          exit 1

      - name: Smoke test storefront homepage and health
        run: |
          for path in / /api/health; do
            code="$(curl --silent --show-error --output /tmp/sunvera-smoke-body --write-out '%{http_code}' "http://127.0.0.1:3000${path}")" || {
              echo "Request failed for ${path}"
              cat /tmp/sunvera-next.log || true
              exit 1
            }
            if [ "$code" != "200" ]; then
              echo "Expected HTTP 200 for ${path}, got ${code}"
              head -c 1000 /tmp/sunvera-smoke-body || true
              echo
              cat /tmp/sunvera-next.log || true
              exit 1
            fi
            echo "${path}: HTTP ${code}"
          done

      - name: P1-1 Variant regression tests
        env:
          P1_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p1:variant

      - name: P1-2 Wilaya and Commune regression tests
        env:
          P1_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p1:location

      - name: P1-3 SKU uniqueness regression tests
        run: npm run test:p1:sku

      - name: P1-4 Product relations atomicity regression tests
        env:
          P1_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p1:atomicity

      - name: P1-5 Production storage regression tests
        env:
          P1_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p1:storage

      - name: P1-6 Rate limit regression tests
        env:
          P1_BASE_URL: http://127.0.0.1:3000
          RATE_LIMIT_TRUST_PROXY: "false"
        run: npm run test:p1:rate-limit

      - name: P1-7 CMS productsByIds regression tests
        run: npm run test:p1:cms

      - name: P2-1 Admin product filtering regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:product-filtering

      - name: P2-8 Error message hardening regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:error-hardening

      - name: P2-7 Order status transitions regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:order-status

      - name: P2-6 Settings validation regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:settings-validation

      - name: P2-5 Database indexes regression tests
        run: npm run test:p2:database-indexes

      - name: P2-4 Database checks regression tests
        run: npm run test:p2:database-checks

      - name: P2-3 Media pagination regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:media-pagination

      - name: P2-9 Media deletion safety regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:media-deletion

      - name: P2-2 Product image association regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:image-association

      # Local storage is refused in production mode on purpose (P1-5), so the upload →
      # database failure → cleanup paths are exercised against a development-mode instance of
      # the same app, on its own port and its own build directory (the production build and the
      # server above are left untouched).
      - name: P2-10 Orphan storage cleanup regression tests
        env:
          P2_BASE_URL: http://127.0.0.1:3100
          NEXT_DIST_DIR: .next-dev
          PORT: 3100
        run: |
          npm run dev > /tmp/sunvera-dev.log 2>&1 &
          echo $! > /tmp/sunvera-dev.pid
          for i in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3100/api/health > /dev/null
          set +e
          npm run test:p2:storage-cleanup
          status=$?
          set -e
          kill "$(cat /tmp/sunvera-dev.pid)" 2>/dev/null || true
          pkill -f "next dev" 2>/dev/null || true
          pkill -f "next-server" 2>/dev/null || true
          # `next dev` rewrites next-env.d.ts / tsconfig.json for its own build directory;
          # the checked-in files must stay as they are for the next run.
          git checkout -- next-env.d.ts tsconfig.json 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "--- development server log ---"
            cat /tmp/sunvera-dev.log || true
            exit "$status"
          fi

      - name: P2-11 Master AI normalization regression tests
        run: npm run test:p2:master-ai-normalization

      - name: P2-12 Master AI contract regression tests
        run: npm run test:p2:master-ai-contract

      - name: Ensure production-mode app is running for Master AI runtime tests
        run: |
          if ! curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
            echo "Production-mode app was stopped by the development storage-cleanup test; restarting it."
            npm run start > /tmp/sunvera-next.log 2>&1 &
            echo $! > /tmp/sunvera-next.pid
          fi
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Production-mode app did not recover for Master AI runtime tests."
          cat /tmp/sunvera-next.log || true
          exit 1

      - name: P2-13 Master AI runtime execution integration tests
        env:
          P2_BASE_URL: http://127.0.0.1:3000
        run: npm run test:p2:master-ai-runtime

      # Live provider integration is opt-in: only a manually dispatched run uploads
      # temporary assets to the configured Cloudinary account. Never runs on PR/push.
      - name: P2-14 Live Cloudinary image/video integration test
        if: github.event_name == 'workflow_dispatch'
        env:
          P2_CLOUD_BASE_URL: http://127.0.0.1:3200
          NEXT_DIST_DIR: .next-cloud-storage
          PORT: 3200
          CLOUD_STORAGE_TEST_CONFIRM: YES_UPLOAD_AND_DELETE_TEST_ASSETS
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Required repository secret $name is missing; no cloud uploads were attempted."
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          NEXT_DIST_DIR=.next-cloud-storage PORT=3200 ./node_modules/.bin/next dev --port 3200 > /tmp/sunvera-cloud-storage.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            git checkout -- next-env.d.ts tsconfig.json 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3200/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Cloud test app did not become ready."
            cat /tmp/sunvera-cloud-storage.log || true
            exit 1
          fi
          npm run test:p2:cloud-storage
          echo "Live cloud test completed. Review P2_CLOUD_STORAGE_CLEANUP_PASS before treating it as clean."

      - name: Show application log on failure
        if: failure()
        run: |
          cat /tmp/sunvera-next.log || true
          cat /tmp/sunvera-dev.log 2>/dev/null || true
