name: Homepage Fix Validation

on:
  push:
    branches:
      - fix/homepage-category-images-chrome-2026-10-19

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sunvera_ci
      AUTH_SECRET: ci-only-auth-secret-for-homepage-fix-validation
      ADMIN_PASSWORD: CiOnlyAdminPassword123456
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
