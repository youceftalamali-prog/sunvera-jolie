name: Homepage Fix Validation

on:
  push:
    branches:
      - fix/homepage-category-images-chrome-2026-10-19

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sunvera_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sunvera_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sunvera_ci
      AUTH_SECRET: ci-only-auth-secret-for-homepage-fix-validation
      ADMIN_PASSWORD: CiOnlyAdminPassword123456
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check PostgreSQL connectivity
        run: npm run db:check
      - name: Apply database schema
        run: npm run db:push
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
